<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR Only Chair Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- model-viewer -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.3.0/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #ar-button {
      padding: 20px 40px;        /* smaller padding */
      font-size: 1.5rem;         /* smaller font size */
      font-weight: bold;
      border-radius: 12px;       /* slightly smaller rounded corners */
      border: none;
      background-color: black;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
      white-space: nowrap;       /* ensures text never wraps */
    }

    #ar-button:hover {
      transform: scale(1.05);
    }

    model-viewer {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- iOS Quick Look link -->
  <a id="iosLink" class="ar-link" rel="ar"
     href="blackchair.usdz"
     style="display:none;">
    <button id="ar-button">View Chair in AR</button>
  </a>

  <!-- Android/WebXR button -->
  <button id="ar-button-android" style="display:none;">View Chair in AR</button>

  <model-viewer id="viewer"
    src="blackchair.glb"
    ios-src="blackchair.usdz"
    ar
    ar-modes="quick-look scene-viewer webxr">
  </model-viewer>

  <script>
    const ua = navigator.userAgent || navigator.vendor || '';
    const isIOS = /iPad|iPhone|iPod/.test(ua);
    const iosLink = document.getElementById('iosLink');
    const androidBtn = document.getElementById('ar-button-android');
    const viewer = document.getElementById('viewer');

    if (isIOS) {
      iosLink.style.display = 'block';
    } else {
      androidBtn.style.display = 'inline-block';
    }

    androidBtn.addEventListener('click', async () => {
      try {
        await viewer.activateAR();
      } catch (e) {
        alert("AR not available on this device/browser.");
      }
    });
  </script>
</body>
</html>
