<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR Only Chair Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Pin model-viewer (stable) -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.3.0/dist/model-viewer.min.js"></script>

  <style>
    body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff}
    .bigbtn{padding:60px 100px;font-size:3rem;font-weight:700;border-radius:16px;border:none;
      background:#000;color:#fff;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.2);text-decoration:none;
      display:inline-block}
    .bigbtn:active,.bigbtn:hover{transform:scale(1.03)}
    /* keep viewer offscreen */
    model-viewer{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
    #fallback{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:none;
      background:#111;color:#fff;padding:12px 16px;border-radius:12px}
  </style>
</head>
<body>

  <!-- iOS: real Quick Look link that user taps -->
  <a id="iosLink" class="bigbtn" rel="ar"
     href="https://alogoscope.github.io/ar-chair-demo/blackchair.usdz"
     style="display:none">View Chair in AR</a>

  <!-- Non-iOS: button that calls activateAR -->
  <button id="arBtn" class="bigbtn" style="display:none">View Chair in AR</button>

  <model-viewer id="viewer"
    src="https://alogoscope.github.io/ar-chair-demo/blackchair.glb"
    ios-src="https://alogoscope.github.io/ar-chair-demo/blackchair.usdz"
    ar ar-modes="quick-look scene-viewer webxr">
  </model-viewer>

  <div id="fallback">AR isn’t available here. Try opening in Safari/Chrome (not inside another app).</div>

  <script>
    const ua = navigator.userAgent || navigator.vendor || '';
    const isIOS = /iPad|iPhone|iPod/.test(ua);
    const iosLink = document.getElementById('iosLink');
    const arBtn = document.getElementById('arBtn');
    const viewer = document.getElementById('viewer');
    const fallback = document.getElementById('fallback');

    // Show the right control
    if (isIOS) {
      iosLink.style.display = 'inline-block'; // user taps real <a rel="ar">
    } else {
      arBtn.style.display = 'inline-block';
    }

    // Android/WebXR: use model-viewer’s launcher
    arBtn?.addEventListener('click', async () => {
      try {
        await viewer.activateAR();
      } catch (e) {
        fallback.style.display = 'block';
      }
    });
  </script>
</body>
</html>
